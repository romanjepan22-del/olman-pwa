<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="OLMAN"><meta name="application-name" content="OLMAN rozpis služeb"><title>OLMAN SERVICE s.r.o. – Rozpis služeb</title><link rel="manifest" href="./manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}#splash{position:fixed;inset:0;z-index:10;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:opacity .35s ease}#splash img{display:block;width:min(458px,82vw);height:auto;image-rendering:auto}#loading{margin-top:48px;color:#fff;font:500 18px/1.3 Arial,sans-serif;letter-spacing:.2px}#spinner{margin-top:18px;width:38px;height:38px;border:3px solid #333;border-top-color:#f58220;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#app{display:block;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .25s ease}body.ready #app{opacity:1}body.ready #splash{opacity:0;pointer-events:none}</style></head><body><div id="splash"><img src="./olman-logo.png" alt="OLMAN SERVICE s.r.o."><div id="loading">Načítání aplikace…</div><div id="spinner"></div></div><iframe id="app" src="https://script.google.com/macros/s/AKfycbxaSbhUscpezum_FvUL0-FfXavicVT5zoYPkdwJ-q-8L0JhHW7hqlZ1Kg2YOuf2fT9V/exec" title="OLMAN SERVICE s.r.o. – Rozpis služeb" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe><script>const iframe=document.getElementById('app');let done=false;function showApp(){if(done)return;done=true;document.body.classList.add('ready');setTimeout(()=>document.getElementById('splash').remove(),450)}iframe.addEventListener('load',()=>setTimeout(showApp,250));setTimeout(showApp,12000);if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(()=>{}));</script></body></html>
